<div class="users-header">
  <h2>Users</h2>
  <form class="search-form" (submit)="$event.preventDefault()">
    <input
      type="text"
      placeholder="email"
      [(ngModel)]="inputValue"
      name="inputValue"
    />
    <button type="submit">Search</button>
  </form>
</div>
<section>
  @for(user of users;track user){ @if
  (user.email.toLowerCase().includes(inputValue)) {
  <article>
    <figure>
      <img src="{{user.profilePicture}}" alt="profile" />
    </figure>
    <h3 [ngStyle]="{'background': getRoleColor(user.role)}">{{user.role}}</h3>
    <ul>
      <li><h4>Username: {{user.username}}</h4></li>
      <li>Phone number: {{user.phone}}</li>
      <li>Email: {{user.email}}</li>
      <li>Birthdate: {{user.birthdate}}</li>
    </ul>
  </article>
  }}
</section>
